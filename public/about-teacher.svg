<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgAbout" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="glowAbout" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorAbout" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="shadowAbout">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background with warm gradient -->
  <rect width="600" height="600" fill="url(#bgAbout)"/>
  <rect width="600" height="600" fill="url(#glowAbout)"/>

  <!-- Decorative arch (Islamic architecture) -->
  <path d="M 100 600 L 100 250 Q 100 100 300 100 Q 500 100 500 250 L 500 600 Z" fill="#fef3c7" opacity="0.4"/>
  <path d="M 120 600 L 120 260 Q 120 130 300 130 Q 480 130 480 260 L 480 600 Z" fill="none" stroke="#92400e" stroke-width="2" opacity="0.3"/>

  <!-- Arabic calligraphy at top -->
  <g transform="translate(300, 80)" opacity="0.4">
    <text fill="#92400e" font-family="Cairo, sans-serif" font-size="32" font-weight="900" text-anchor="middle">بسم الله الرحمن الرحيم</text>
  </g>

  <!-- Floor -->
  <rect x="0" y="500" width="600" height="100" fill="url(#floorAbout)"/>
  <line x1="0" y1="500" x2="600" y2="500" stroke="#1c0701" stroke-width="2"/>

  <!-- Decorative pattern on floor -->
  <g opacity="0.4">
    <polygon points="50,510 70,520 50,530 30,520" fill="#fbbf24"/>
    <polygon points="150,540 170,550 150,560 130,550" fill="#fbbf24"/>
    <polygon points="250,520 270,530 250,540 230,530" fill="#fbbf24"/>
    <polygon points="350,540 370,550 350,560 330,550" fill="#fbbf24"/>
    <polygon points="450,520 470,530 450,540 430,530" fill="#fbbf24"/>
    <polygon points="550,540 570,550 550,560 530,550" fill="#fbbf24"/>
  </g>

  <!-- Plant left -->
  <g transform="translate(80, 380)">
    <rect x="-12" y="0" width="24" height="40" fill="#92400e" rx="3"/>
    <path d="M 0 0 Q -18 -30 -22 -55 M 0 0 Q 18 -30 22 -55 M 0 0 Q -5 -35 0 -65 M 0 0 Q 5 -35 0 -65" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-22" cy="-55" rx="8" ry="14" fill="#10b981" transform="rotate(-30 -22 -55)"/>
    <ellipse cx="22" cy="-55" rx="8" ry="14" fill="#10b981" transform="rotate(30 22 -55)"/>
    <ellipse cx="0" cy="-65" rx="7" ry="12" fill="#10b981"/>
    <ellipse cx="-15" cy="-45" rx="6" ry="10" fill="#059669" transform="rotate(-20 -15 -45)"/>
    <ellipse cx="15" cy="-45" rx="6" ry="10" fill="#059669" transform="rotate(20 15 -45)"/>
  </g>

  <!-- Plant right -->
  <g transform="translate(520, 380)">
    <rect x="-12" y="0" width="24" height="40" fill="#92400e" rx="3"/>
    <path d="M 0 0 Q -18 -30 -22 -55 M 0 0 Q 18 -30 22 -55 M 0 0 Q -5 -35 0 -65 M 0 0 Q 5 -35 0 -65" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-22" cy="-55" rx="8" ry="14" fill="#10b981" transform="rotate(-30 -22 -55)"/>
    <ellipse cx="22" cy="-55" rx="8" ry="14" fill="#10b981" transform="rotate(30 22 -55)"/>
    <ellipse cx="0" cy="-65" rx="7" ry="12" fill="#10b981"/>
  </g>

  <!-- Female Gulf teacher (center, prominent) -->
  <g transform="translate(300, 280)" filter="url(#shadowAbout)">
    <!-- Abaya (long black dress with gold trim) -->
    <path d="M -80 230 Q -100 100 -50 70 L 50 70 Q 100 100 80 230 Z" fill="#0f172a"/>
    <!-- Abaya gold trim along edges -->
    <path d="M -80 230 Q -100 100 -50 70 L 50 70 Q 100 100 80 230" fill="none" stroke="#c9a55a" stroke-width="2" stroke-dasharray="4 2"/>
    <!-- Abaya decorative pattern -->
    <g opacity="0.3">
      <circle cx="-50" cy="150" r="3" fill="#c9a55a"/>
      <circle cx="-30" cy="180" r="3" fill="#c9a55a"/>
      <circle cx="0" cy="200" r="3" fill="#c9a55a"/>
      <circle cx="30" cy="180" r="3" fill="#c9a55a"/>
      <circle cx="50" cy="150" r="3" fill="#c9a55a"/>
    </g>
    <!-- Hijab (royal blue) -->
    <ellipse cx="0" cy="30" rx="50" ry="55" fill="#1e3a8a"/>
    <!-- Hijab drape on shoulders -->
    <path d="M -45 60 Q -50 80 -40 90 L 40 90 Q 50 80 45 60 Z" fill="#1e3a8a"/>
    <!-- Face -->
    <ellipse cx="0" cy="30" rx="28" ry="32" fill="#fcd9b6"/>
    <!-- Hair peeking under hijab (front) -->
    <path d="M -25 35 Q -28 50 -20 60" fill="#1f2937" stroke="none" opacity="0.4"/>
    <path d="M 25 35 Q 28 50 20 60" fill="#1f2937" stroke="none" opacity="0.4"/>
    <!-- Eyebrows (thin, defined) -->
    <path d="M -13 18 Q -8 15 -3 18" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 3 18 Q 8 15 13 18" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Eyes (happy, with kohl) -->
    <ellipse cx="-8" cy="25" rx="4" ry="2.5" fill="#1f2937"/>
    <ellipse cx="8" cy="25" rx="4" ry="2.5" fill="#1f2937"/>
    <!-- Eye whites -->
    <circle cx="-8" cy="25" r="1.2" fill="#fff"/>
    <circle cx="8" cy="25" r="1.2" fill="#fff"/>
    <!-- Eyelashes -->
    <path d="M -12 24 L -13 22 M -10 23 L -10 21 M -8 23 L -8 21" stroke="#1f2937" stroke-width="0.8"/>
    <path d="M 12 24 L 13 22 M 10 23 L 10 21 M 8 23 L 8 21" stroke="#1f2937" stroke-width="0.8"/>
    <!-- Cheeks (rosy) -->
    <ellipse cx="-18" cy="35" rx="5" ry="3" fill="#f9a8a8" opacity="0.6"/>
    <ellipse cx="18" cy="35" rx="5" ry="3" fill="#f9a8a8" opacity="0.6"/>
    <!-- Nose (subtle) -->
    <path d="M 0 28 L -1 35 L 1 35 Z" fill="#fbbf24" opacity="0.3"/>
    <!-- Smile (warm) -->
    <path d="M -8 42 Q 0 48 8 42" fill="none" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>
    <!-- Lips -->
    <ellipse cx="0" cy="42" rx="6" ry="2" fill="#fb7185" opacity="0.6"/>

    <!-- Hands (open, welcoming) -->
    <ellipse cx="-60" cy="120" rx="12" ry="18" fill="#fcd9b6" transform="rotate(-20 -60 120)"/>
    <ellipse cx="60" cy="120" rx="12" ry="18" fill="#fcd9b6" transform="rotate(20 60 120)"/>
    <!-- Henna on hands -->
    <g opacity="0.6" transform="translate(-60, 110)">
      <circle cx="0" cy="0" r="2" fill="#92400e"/>
      <circle cx="-3" cy="3" r="1.5" fill="#92400e"/>
      <circle cx="3" cy="3" r="1.5" fill="#92400e"/>
    </g>
    <g opacity="0.6" transform="translate(60, 110)">
      <circle cx="0" cy="0" r="2" fill="#92400e"/>
      <circle cx="-3" cy="3" r="1.5" fill="#92400e"/>
      <circle cx="3" cy="3" r="1.5" fill="#92400e"/>
    </g>
  </g>

  <!-- Small boy student (left, with ghutra) - hugging teacher / sitting near -->
  <g transform="translate(160, 400)" filter="url(#shadowAbout)">
    <!-- Body (white thobe) -->
    <path d="M -35 100 Q -42 50 -20 35 L 20 35 Q 42 50 35 100 Z" fill="#fff"/>
    <!-- Thobe details (buttons) -->
    <circle cx="0" cy="55" r="1.5" fill="#92400e"/>
    <circle cx="0" cy="65" r="1.5" fill="#92400e"/>
    <circle cx="0" cy="75" r="1.5" fill="#92400e"/>
    <!-- Ghutra (white) -->
    <path d="M -30 10 Q -38 -15 0 -18 Q 38 -15 30 10 Q 22 0 0 0 Q -22 0 -30 10 Z" fill="#fff"/>
    <!-- Agal (black rope) -->
    <path d="M -28 -5 Q 0 -15 28 -5" fill="none" stroke="#000" stroke-width="2"/>
    <!-- Ghutra tail -->
    <path d="M 22 -5 L 28 5 L 26 10" fill="#fff" stroke="#000" stroke-width="0.5"/>
    <!-- Face -->
    <ellipse cx="0" cy="0" rx="20" ry="22" fill="#fcd9b6"/>
    <!-- Hair (peeking) -->
    <path d="M -15 -18 Q -10 -22 -5 -18" fill="#1f2937" stroke="none"/>
    <!-- Eyebrows -->
    <path d="M -10 -8 Q -5 -10 0 -8" fill="none" stroke="#1f2937" stroke-width="1.2"/>
    <path d="M 0 -8 Q 5 -10 10 -8" fill="none" stroke="#1f2937" stroke-width="1.2"/>
    <!-- Eyes (big, happy) -->
    <ellipse cx="-5" cy="0" rx="2.5" ry="2" fill="#1f2937"/>
    <ellipse cx="5" cy="0" rx="2.5" ry="2" fill="#1f2937"/>
    <circle cx="-5" cy="-0.5" r="0.8" fill="#fff"/>
    <circle cx="5" cy="-0.5" r="0.8" fill="#fff"/>
    <!-- Eyelashes -->
    <path d="M -7 -1 L -8 -3" stroke="#1f2937" stroke-width="0.6"/>
    <path d="M 7 -1 L 8 -3" stroke="#1f2937" stroke-width="0.6"/>
    <!-- Big smile -->
    <path d="M -6 8 Q 0 13 6 8" fill="none" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Cheeks -->
    <ellipse cx="-12" cy="5" rx="3" ry="2" fill="#f9a8a8" opacity="0.6"/>
    <ellipse cx="12" cy="5" rx="3" ry="2" fill="#f9a8a8" opacity="0.6"/>
    <!-- Small hands up (waving) -->
    <ellipse cx="-30" cy="60" rx="6" ry="8" fill="#fcd9b6" transform="rotate(-30 -30 60)"/>
  </g>

  <!-- Small girl student (right, with pink hijab) -->
  <g transform="translate(440, 400)" filter="url(#shadowAbout)">
    <!-- Body (pink dress) -->
    <path d="M -35 100 Q -42 50 -20 35 L 20 35 Q 42 50 35 100 Z" fill="#ec4899"/>
    <!-- Dress pattern (polka dots) -->
    <circle cx="-15" cy="60" r="2" fill="#fff" opacity="0.7"/>
    <circle cx="0" cy="65" r="2" fill="#fff" opacity="0.7"/>
    <circle cx="15" cy="60" r="2" fill="#fff" opacity="0.7"/>
    <circle cx="-10" cy="80" r="2" fill="#fff" opacity="0.7"/>
    <circle cx="10" cy="80" r="2" fill="#fff" opacity="0.7"/>
    <!-- Hijab (pink) -->
    <ellipse cx="0" cy="0" rx="25" ry="27" fill="#ec4899"/>
    <ellipse cx="0" cy="-15" rx="22" ry="15" fill="#ec4899"/>
    <!-- Hijab side drapes -->
    <path d="M -22 10 Q -28 25 -20 35" fill="#ec4899" stroke="none"/>
    <path d="M 22 10 Q 28 25 20 35" fill="#ec4899" stroke="none"/>
    <!-- Face -->
    <ellipse cx="0" cy="0" rx="18" ry="20" fill="#fcd9b6"/>
    <!-- Braids hanging -->
    <ellipse cx="-23" cy="20" rx="6" ry="18" fill="#1f2937"/>
    <ellipse cx="23" cy="20" rx="6" ry="18" fill="#1f2937"/>
    <!-- Braid ties (colorful) -->
    <ellipse cx="-23" cy="35" rx="4" ry="2" fill="#fbbf24"/>
    <ellipse cx="23" cy="35" rx="4" ry="2" fill="#fbbf24"/>
    <!-- Eyebrows -->
    <path d="M -9 -8 Q -4 -10 0 -8" fill="none" stroke="#1f2937" stroke-width="1.2"/>
    <path d="M 0 -8 Q 4 -10 9 -8" fill="none" stroke="#1f2937" stroke-width="1.2"/>
    <!-- Eyes (big, sparkly) -->
    <ellipse cx="-5" cy="0" rx="2.5" ry="2" fill="#1f2937"/>
    <ellipse cx="5" cy="0" rx="2.5" ry="2" fill="#1f2937"/>
    <circle cx="-5" cy="-0.5" r="1" fill="#fff"/>
    <circle cx="5" cy="-0.5" r="1" fill="#fff"/>
    <!-- Eyelashes -->
    <path d="M -7 -1 L -8 -3" stroke="#1f2937" stroke-width="0.6"/>
    <path d="M 7 -1 L 8 -3" stroke="#1f2937" stroke-width="0.6"/>
    <!-- Smile (happy) -->
    <path d="M -5 8 Q 0 13 5 8" fill="none" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Cheeks (rosy) -->
    <ellipse cx="-11" cy="5" rx="3" ry="2" fill="#f9a8a8" opacity="0.7"/>
    <ellipse cx="11" cy="5" rx="3" ry="2" fill="#f9a8a8" opacity="0.7"/>
    <!-- Tiny hands up -->
    <ellipse cx="32" cy="55" rx="6" ry="8" fill="#fcd9b6" transform="rotate(30 32 55)"/>
  </g>

  <!-- Floating hearts (warmth & love) -->
  <g opacity="0.6">
    <path d="M 130 200 Q 125 195 128 190 Q 132 195 130 200 Q 128 195 132 190 Q 135 195 130 200" fill="#ec4899">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 5,-15; 0,0" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 470 180 Q 465 175 468 170 Q 472 175 470 180 Q 468 175 472 170 Q 475 175 470 180" fill="#ec4899">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; -5,-12; 0,0" dur="3.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Decorative stars -->
  <g opacity="0.5" fill="#fbbf24">
    <polygon points="100,150 105,160 115,162 108,170 110,180 100,175 90,180 92,170 85,162 95,160">
      <animateTransform attributeName="transform" type="rotate" from="0 100 165" to="360 100 165" dur="20s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="500,170 505,180 515,182 508,190 510,200 500,195 490,200 492,190 485,182 495,180">
      <animateTransform attributeName="transform" type="rotate" from="0 500 185" to="-360 500 185" dur="25s" repeatCount="indefinite"/>
    </polygon>
  </g>
</svg>
