<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="light3" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg3)"/>
  <rect width="800" height="500" fill="url(#light3)"/>

  <!-- Sky through window -->
  <rect x="50" y="50" width="200" height="120" rx="6" fill="#bfdbfe"/>
  <circle cx="100" cy="100" r="20" fill="#fef3c7"/>
  <polygon points="120,90 130,80 140,90" fill="#fef3c7"/>
  <polygon points="145,80 155,70 165,80" fill="#fef3c7"/>
  <polygon points="170,90 180,80 190,90" fill="#fef3c7"/>
  <!-- Clouds -->
  <ellipse cx="180" cy="130" rx="25" ry="8" fill="#fff" opacity="0.9"/>
  <ellipse cx="160" cy="125" rx="15" ry="6" fill="#fff" opacity="0.9"/>
  <ellipse cx="195" cy="135" rx="18" ry="6" fill="#fff" opacity="0.9"/>

  <!-- Floor -->
  <rect x="0" y="380" width="800" height="120" fill="url(#floor3)"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#fbbf24" stroke-width="2"/>

  <!-- ABC board with Arabic numerals -->
  <g transform="translate(440, 80)">
    <rect x="0" y="0" width="280" height="160" rx="8" fill="#fff" stroke="#92400e" stroke-width="4"/>
    <text x="60" y="50" fill="#dc2626" font-family="Cairo, sans-serif" font-size="32" font-weight="800">أ</text>
    <text x="120" y="50" fill="#0ea5e9" font-family="Cairo, sans-serif" font-size="32" font-weight="800">ب</text>
    <text x="180" y="50" fill="#10b981" font-family="Cairo, sans-serif" font-size="32" font-weight="800">ت</text>
    <text x="240" y="50" fill="#f59e0b" font-family="Cairo, sans-serif" font-size="32" font-weight="800">ث</text>
    <text x="60" y="100" fill="#7c3aed" font-family="Cairo, sans-serif" font-size="32" font-weight="800">١</text>
    <text x="120" y="100" fill="#ec4899" font-family="Cairo, sans-serif" font-size="32" font-weight="800">٢</text>
    <text x="180" y="100" fill="#06b6d4" font-family="Cairo, sans-serif" font-size="32" font-weight="800">٣</text>
    <text x="240" y="100" fill="#f59e0b" font-family="Cairo, sans-serif" font-size="32" font-weight="800">٤</text>
    <text x="140" y="145" fill="#92400e" font-family="Cairo, sans-serif" font-size="14" text-anchor="middle">أبجدية عربية</text>
  </g>

  <!-- Female teacher (Gulf, abaya + colorful hijab) -->
  <g transform="translate(400, 270)">
    <!-- Abaya body -->
    <path d="M -50 130 Q -65 60 -30 45 L 30 45 Q 65 60 50 130 Z" fill="#1f2937"/>
    <!-- Decorative abaya trim -->
    <path d="M -50 130 Q -55 100 -45 80 L 45 80 Q 55 100 50 130" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
    <!-- Hijab (colorful - turquoise) -->
    <ellipse cx="0" cy="20" rx="40" ry="44" fill="#0891b2"/>
    <!-- Face -->
    <ellipse cx="0" cy="22" rx="22" ry="26" fill="#fcd9b6"/>
    <!-- Hair peeking (under hijab) -->
    <path d="M -22 30 Q -25 45 -15 50" fill="#1f2937"/>
    <path d="M 22 30 Q 25 45 15 50" fill="#1f2937"/>
    <!-- Eyes (with kohl) -->
    <path d="M -10 18 Q -7 15 -4 18" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 4 18 Q 7 15 10 18" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Eyelashes -->
    <path d="M -10 17 L -11 14" stroke="#1f2937" stroke-width="1"/>
    <path d="M -8 16 L -8 13" stroke="#1f2937" stroke-width="1"/>
    <path d="M 10 17 L 11 14" stroke="#1f2937" stroke-width="1"/>
    <path d="M 8 16 L 8 13" stroke="#1f2937" stroke-width="1"/>
    <!-- Smile -->
    <path d="M -7 32 Q 0 36 7 32" fill="none" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Lips -->
    <ellipse cx="0" cy="32" rx="3" ry="1.5" fill="#fb7185" opacity="0.4"/>
    <!-- Cheeks -->
    <circle cx="-13" cy="28" r="3" fill="#f9a8a8" opacity="0.5"/>
    <circle cx="13" cy="28" r="3" fill="#f9a8a8" opacity="0.5"/>
    <!-- Hand raised (waving) -->
    <g transform="translate(-55, 60) rotate(-30)">
      <ellipse cx="0" cy="0" rx="10" ry="14" fill="#fcd9b6"/>
      <path d="M -3 -8 L -4 -12 M 0 -10 L 0 -14 M 3 -8 L 4 -12" stroke="#fcd9b6" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Other hand holding book -->
    <ellipse cx="40" cy="90" rx="10" ry="14" fill="#fcd9b6"/>
    <rect x="20" y="85" width="40" height="35" fill="#dc2626" rx="3"/>
    <rect x="22" y="87" width="36" height="31" fill="#fef3c7"/>
    <text x="40" y="108" fill="#dc2626" font-family="Cairo, sans-serif" font-size="10" text-anchor="middle">حروف</text>
  </g>

  <!-- Student girl with hijab (small child) - left -->
  <g transform="translate(200, 320)">
    <!-- Sitting pose -->
    <ellipse cx="0" cy="60" rx="40" ry="20" fill="#7c3aed"/>
    <!-- Body -->
    <path d="M -25 60 Q -30 30 -10 20 L 10 20 Q 30 30 25 60 Z" fill="#ec4899"/>
    <!-- Hijab (pink) -->
    <ellipse cx="0" cy="0" rx="22" ry="24" fill="#ec4899"/>
    <ellipse cx="0" cy="2" rx="16" ry="18" fill="#fcd9b6"/>
    <ellipse cx="0" cy="-15" rx="20" ry="14" fill="#ec4899"/>
    <!-- Braids/hair on sides -->
    <ellipse cx="-22" cy="15" rx="6" ry="15" fill="#ec4899"/>
    <ellipse cx="22" cy="15" rx="6" ry="15" fill="#ec4899"/>
    <!-- Eyes -->
    <circle cx="-5" cy="0" r="1.5" fill="#1f2937"/>
    <circle cx="5" cy="0" r="1.5" fill="#1f2937"/>
    <!-- Eyelashes -->
    <path d="M -7 -1 L -8 -3" stroke="#1f2937" stroke-width="0.8"/>
    <path d="M 7 -1 L 8 -3" stroke="#1f2937" stroke-width="0.8"/>
    <!-- Smile (with braces look) -->
    <path d="M -4 8 Q 0 11 4 8" fill="none" stroke="#92400e" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Cheeks -->
    <circle cx="-10" cy="5" r="3" fill="#f9a8a8" opacity="0.6"/>
    <circle cx="10" cy="5" r="3" fill="#f9a8a8" opacity="0.6"/>
    <!-- Book on lap -->
    <rect x="-15" y="55" width="30" height="6" fill="#10b981"/>
  </g>

  <!-- Student boy with ghutra - right -->
  <g transform="translate(600, 320)">
    <ellipse cx="0" cy="60" rx="40" ry="20" fill="#10b981"/>
    <!-- Body (thobe) -->
    <path d="M -25 60 Q -30 30 -10 20 L 10 20 Q 30 30 25 60 Z" fill="#fff"/>
    <!-- Ghutra (white) -->
    <path d="M -25 -2 Q -30 -22 0 -25 Q 30 -22 25 -2 Q 18 -10 0 -10 Q -18 -10 -25 -2 Z" fill="#fff"/>
    <!-- Agal -->
    <path d="M -23 -12 Q 0 -20 23 -12" fill="none" stroke="#000" stroke-width="2"/>
    <!-- Agal tail -->
    <path d="M 18 -12 L 22 -2 M 18 -12 L 20 -5" stroke="#000" stroke-width="1"/>
    <!-- Face -->
    <ellipse cx="0" cy="0" rx="18" ry="20" fill="#fcd9b6"/>
    <!-- Hair peek -->
    <path d="M -15 -15 Q -10 -18 -5 -15" fill="#1f2937" stroke="none"/>
    <!-- Eyes (happy - crescent) -->
    <path d="M -8 -3 Q -5 -6 -2 -3" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 2 -3 Q 5 -6 8 -3" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Big smile -->
    <path d="M -6 8 Q 0 13 6 8" fill="none" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Cheeks -->
    <circle cx="-10" cy="5" r="2.5" fill="#f9a8a8" opacity="0.5"/>
    <circle cx="10" cy="5" r="2.5" fill="#f9a8a8" opacity="0.5"/>
    <!-- Crayons in hand -->
    <rect x="15" y="40" width="3" height="20" fill="#dc2626"/>
    <rect x="20" y="38" width="3" height="22" fill="#0ea5e9"/>
    <rect x="25" y="42" width="3" height="18" fill="#f59e0b"/>
  </g>

  <!-- Tiny girl toddler - front center -->
  <g transform="translate(400, 400)">
    <!-- Body (dress) -->
    <path d="M -20 30 Q -25 5 -10 -5 L 10 -5 Q 25 5 20 30 Z" fill="#fbbf24"/>
    <ellipse cx="0" cy="-5" rx="15" ry="3" fill="#f59e0b"/>
    <!-- Hijab small -->
    <ellipse cx="0" cy="-20" rx="18" ry="18" fill="#06b6d4"/>
    <ellipse cx="0" cy="-18" rx="13" ry="15" fill="#fcd9b6"/>
    <ellipse cx="0" cy="-30" rx="15" ry="10" fill="#06b6d4"/>
    <!-- Tiny eyes -->
    <circle cx="-4" cy="-18" r="1.2" fill="#1f2937"/>
    <circle cx="4" cy="-18" r="1.2" fill="#1f2937"/>
    <!-- Big smile -->
    <path d="M -4 -12 Q 0 -8 4 -12" fill="none" stroke="#92400e" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Cheeks -->
    <circle cx="-9" cy="-14" r="2.5" fill="#f9a8a8" opacity="0.7"/>
    <circle cx="9" cy="-14" r="2.5" fill="#f9a8a8" opacity="0.7"/>
  </g>

  <!-- Decorative alphabet blocks on floor -->
  <g transform="translate(60, 440)">
    <rect x="0" y="0" width="30" height="30" fill="#dc2626" rx="3" stroke="#fff" stroke-width="1"/>
    <text x="15" y="22" fill="#fff" font-family="Cairo, sans-serif" font-size="20" font-weight="800" text-anchor="middle">أ</text>
    <rect x="35" y="0" width="30" height="30" fill="#0ea5e9" rx="3" stroke="#fff" stroke-width="1"/>
    <text x="50" y="22" fill="#fff" font-family="Cairo, sans-serif" font-size="20" font-weight="800" text-anchor="middle">ب</text>
    <rect x="70" y="0" width="30" height="30" fill="#10b981" rx="3" stroke="#fff" stroke-width="1"/>
    <text x="85" y="22" fill="#fff" font-family="Cairo, sans-serif" font-size="20" font-weight="800" text-anchor="middle">ت</text>
  </g>

  <!-- Plant in corner -->
  <g transform="translate(730, 320)">
    <rect x="-15" y="0" width="30" height="50" fill="#92400e" rx="3"/>
    <path d="M 0 0 Q -15 -25 -20 -45 M 0 0 Q 15 -25 20 -45 M 0 0 Q 0 -30 0 -55" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-18" cy="-40" rx="6" ry="10" fill="#10b981" transform="rotate(-25 -18 -40)"/>
    <ellipse cx="18" cy="-40" rx="6" ry="10" fill="#10b981" transform="rotate(25 18 -40)"/>
    <ellipse cx="0" cy="-55" rx="5" ry="9" fill="#10b981"/>
  </g>

  <!-- Floating butterflies/hearts -->
  <g opacity="0.7">
    <path d="M 150 200 Q 145 195 148 190 Q 152 195 150 200 Q 148 195 152 190 Q 155 195 150 200" fill="#ec4899">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 10,-20; 0,0" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
