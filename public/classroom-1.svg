<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="floor1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="board1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="light1" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft1">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg1)"/>
  <rect width="800" height="500" fill="url(#light1)"/>

  <!-- Window -->
  <rect x="40" y="60" width="120" height="100" rx="4" fill="#fde68a" opacity="0.3"/>
  <rect x="40" y="60" width="120" height="100" rx="4" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
  <line x1="100" y1="60" x2="100" y2="160" stroke="#fff" stroke-width="2" opacity="0.5"/>
  <line x1="40" y1="110" x2="160" y2="110" stroke="#fff" stroke-width="2" opacity="0.5"/>

  <!-- Whiteboard with Arabic -->
  <rect x="220" y="80" width="360" height="160" rx="8" fill="url(#board1)" stroke="#92400e" stroke-width="4"/>
  <text x="400" y="130" fill="#fef3c7" font-family="Cairo, sans-serif" font-size="28" font-weight="700" text-anchor="middle" opacity="0.9">بسم الله الرحمن الرحيم</text>
  <text x="400" y="180" fill="#86efac" font-family="Cairo, sans-serif" font-size="18" text-anchor="middle" opacity="0.7">مرحباً بطلاب الصف الثالث</text>
  <text x="400" y="210" fill="#fde68a" font-family="Cairo, sans-serif" font-size="14" text-anchor="middle" opacity="0.6">١ + ٢ = ٣</text>

  <!-- Floor -->
  <rect x="0" y="380" width="800" height="120" fill="url(#floor1)"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#451a03" stroke-width="2"/>

  <!-- Teacher (Gulf female - abaya + hijab) -->
  <g transform="translate(400, 240)">
    <!-- Body abaya -->
    <path d="M -45 140 Q -55 80 -30 50 L 30 50 Q 55 80 45 140 Z" fill="#1f2937"/>
    <!-- Hijab -->
    <ellipse cx="0" cy="20" rx="38" ry="42" fill="#0f172a"/>
    <!-- Face -->
    <ellipse cx="0" cy="22" rx="22" ry="26" fill="#fcd9b6"/>
    <!-- Eyes (closed - smiling) -->
    <path d="M -10 18 Q -7 15 -4 18" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 4 18 Q 7 15 10 18" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M -6 30 Q 0 35 6 30" fill="none" stroke="#92400e" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Cheeks -->
    <circle cx="-12" cy="28" r="3" fill="#f9a8a8" opacity="0.5"/>
    <circle cx="12" cy="28" r="3" fill="#f9a8a8" opacity="0.5"/>
    <!-- Hand pointing at board -->
    <ellipse cx="-55" cy="80" rx="8" ry="12" fill="#fcd9b6" transform="rotate(-20 -55 80)"/>
  </g>

  <!-- Student 1 (boy with ghutra) - left -->
  <g transform="translate(180, 280)">
    <!-- Desk -->
    <rect x="-30" y="80" width="80" height="6" fill="#92400e"/>
    <rect x="-25" y="86" width="4" height="40" fill="#78350f"/>
    <rect x="51" y="86" width="4" height="40" fill="#78350f"/>
    <!-- Body -->
    <path d="M -25 80 Q -30 50 -10 35 L 30 35 Q 50 50 45 80 Z" fill="#fff"/>
    <!-- Ghutra (white head scarf) -->
    <path d="M -28 30 Q -32 5 0 0 Q 32 5 28 30 Q 20 25 0 25 Q -20 25 -28 30 Z" fill="#fff"/>
    <!-- Agal (black rope) -->
    <path d="M -25 18 Q 0 10 25 18" fill="none" stroke="#000" stroke-width="2"/>
    <!-- Face -->
    <ellipse cx="0" cy="18" rx="16" ry="18" fill="#fcd9b6"/>
    <!-- Eyes -->
    <circle cx="-5" cy="18" r="1.5" fill="#1f2937"/>
    <circle cx="5" cy="18" r="1.5" fill="#1f2937"/>
    <!-- Smile -->
    <path d="M -4 25 Q 0 28 4 25" fill="none" stroke="#92400e" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Book on desk -->
    <rect x="-15" y="74" width="30" height="6" fill="#dc2626"/>
  </g>

  <!-- Student 2 (girl - hijab) - right -->
  <g transform="translate(620, 280)">
    <!-- Desk -->
    <rect x="-50" y="80" width="80" height="6" fill="#92400e"/>
    <rect x="-45" y="86" width="4" height="40" fill="#78350f"/>
    <rect x="31" y="86" width="4" height="40" fill="#78350f"/>
    <!-- Body -->
    <path d="M -25 80 Q -30 50 -10 35 L 30 35 Q 50 50 45 80 Z" fill="#7c3aed"/>
    <!-- Hijab -->
    <ellipse cx="0" cy="20" rx="22" ry="25" fill="#5b21b6"/>
    <!-- Face -->
    <ellipse cx="0" cy="20" rx="15" ry="17" fill="#fcd9b6"/>
    <!-- Eyes -->
    <circle cx="-5" cy="20" r="1.5" fill="#1f2937"/>
    <circle cx="5" cy="20" r="1.5" fill="#1f2937"/>
    <!-- Smile -->
    <path d="M -4 27 Q 0 30 4 27" fill="none" stroke="#92400e" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Book -->
    <rect x="-15" y="74" width="30" height="6" fill="#0ea5e9"/>
  </g>

  <!-- Student 3 (boy) - center front -->
  <g transform="translate(400, 340)">
    <!-- Desk -->
    <rect x="-30" y="40" width="80" height="6" fill="#92400e"/>
    <rect x="-25" y="46" width="4" height="40" fill="#78350f"/>
    <rect x="51" y="46" width="4" height="40" fill="#78350f"/>
    <!-- Body -->
    <path d="M -22 40 Q -25 15 -8 5 L 16 5 Q 32 15 28 40 Z" fill="#10b981"/>
    <!-- Ghutra -->
    <path d="M -25 0 Q -28 -20 0 -25 Q 28 -20 25 0 Q 18 -5 0 -5 Q -18 -5 -25 0 Z" fill="#fff"/>
    <path d="M -22 -10 Q 0 -18 22 -10" fill="none" stroke="#000" stroke-width="1.5"/>
    <!-- Face -->
    <ellipse cx="0" cy="0" rx="13" ry="15" fill="#fcd9b6"/>
    <circle cx="-4" cy="0" r="1.2" fill="#1f2937"/>
    <circle cx="4" cy="0" r="1.2" fill="#1f2937"/>
    <path d="M -3 6 Q 0 9 3 6" fill="none" stroke="#92400e" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Decorative books on shelf -->
  <g transform="translate(660, 100)" opacity="0.7">
    <rect x="0" y="0" width="14" height="60" fill="#dc2626" rx="2"/>
    <rect x="16" y="-5" width="14" height="65" fill="#0ea5e9" rx="2"/>
    <rect x="32" y="2" width="14" height="58" fill="#10b981" rx="2"/>
    <rect x="48" y="-3" width="14" height="63" fill="#f59e0b" rx="2"/>
    <rect x="64" y="0" width="14" height="60" fill="#8b5cf6" rx="2"/>
    <rect x="0" y="60" width="78" height="6" fill="#92400e"/>
  </g>

  <!-- Plant in corner -->
  <g transform="translate(720, 320)">
    <rect x="-15" y="0" width="30" height="40" fill="#92400e" rx="3"/>
    <path d="M 0 0 Q -20 -30 -25 -50 M 0 0 Q 20 -30 25 -50 M 0 0 Q -5 -35 0 -60 M 0 0 Q 5 -35 0 -60 M 0 0 Q -15 -25 -20 -45 M 0 0 Q 15 -25 20 -45" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-25" cy="-50" rx="6" ry="10" fill="#10b981" transform="rotate(-30 -25 -50)"/>
    <ellipse cx="25" cy="-50" rx="6" ry="10" fill="#10b981" transform="rotate(30 25 -50)"/>
    <ellipse cx="0" cy="-60" rx="5" ry="9" fill="#10b981"/>
    <ellipse cx="-20" cy="-45" rx="5" ry="8" fill="#059669" transform="rotate(-20 -20 -45)"/>
    <ellipse cx="20" cy="-45" rx="5" ry="8" fill="#059669" transform="rotate(20 20 -45)"/>
  </g>

  <!-- Floating particles -->
  <circle cx="100" cy="250" r="3" fill="#fde68a" opacity="0.6">
    <animate attributeName="cy" values="250;230;250" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="220" r="2" fill="#fef3c7" opacity="0.5">
    <animate attributeName="cy" values="220;200;220" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="50" r="2" fill="#fde68a" opacity="0.7">
    <animate attributeName="cy" values="50;35;50" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
